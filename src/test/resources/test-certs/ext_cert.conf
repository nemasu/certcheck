extensions = extend

[req] # openssl req params
prompt = no
distinguished_name = dn-param

[dn-param] # DN fields
C = US
ST = CA
O = TestCompany1
OU = DevSec
CN = domain.tld
surname = Lastnameson
givenName = Firstnamebert
emailAddress = admin@domain.tld
organizationIdentifier = My Organization ID
serialNumber = My Serial Number
pseudonym = MyPseudonym

[extend] # openssl extensions
subjectKeyIdentifier = hash
authorityKeyIdentifier = keyid,issuer
keyUsage = digitalSignature,keyEncipherment
extendedKeyUsage=serverAuth,clientAuth
subjectAltName = otherName:msUPN;UTF8:admin@domain.tld, email: admin@domain.tld
certificatePolicies = 1.2.3.4, 1.5.6.7.8, @polsect
1.3.6.1.4.1.311.25.2 = ASN1:SEQUENCE:NTDSCASecurityExt

[polsect]
policyIdentifier = 1.3.5.8
CPS.1 = "http://my.host.example.com/"
CPS.2 = "http://my.your.example.com/"
userNotice.1 = @notice

[notice]
explicitText = "Explicit Text Here"
organization = "Organisation Name"
noticeNumbers = 1, 2, 3, 4

[NTDSCASecurityExt]
innerSeq = IMPLICIT:0,SEQUENCE:inner

[inner]
szOID_NTDS_OBJECTSID = OID:1.3.6.1.4.1.311.25.2.1
key = EXPLICIT:0,OCTETSTRING:S-1-5-21-1468012755-800561317-457473099-500
